# Robox mod loader -- WEB BUILD ONLY (preloaded as mods/mods.cfg).
#
# The desktop/Android config lives in build/mods/mods.cfg; this file exists so
# the browser build can differ without touching either. Same syntax:
# one "id = 0|1" per mod, '#' starts a comment, and a mod whose required file
# is missing is forced off regardless.

# Host MIDI + DLS music sampler.        needs: mods/robox.dls
music = 1

# Local / online co-op: second player.  needs: nothing
# OFF on the web. A second player is a second full entity simulated and drawn
# every frame, and the browser build is guest-CPU-bound -- it is the one target
# where that cost comes straight out of the frame budget.
coop  = 0

# Discord Rich Presence.                needs: nothing
# Listed for parity only. There is no Discord IPC endpoint reachable from a
# browser tab, so sdk/robox_discord.c compiles to no-ops on this target.
discord = 0
