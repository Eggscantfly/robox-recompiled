<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #bbb;
    font: 13px/1.5 system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center;
          justify-content: center; }
  /* The drawing buffer is sized from native code (1280x720). Here we only
     control the DISPLAYED size: fit the viewport, keep 16:9, never upscale
     past the buffer so it stays crisp. */
  canvas#canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #000;
    outline: none;
    image-rendering: auto;
    /* The game draws its own Wii pointer; the host arrow on top of it is a
     * second cursor that does not line up with where you are aiming.
     * SDL_ShowCursor cannot do this on the web build -- SDL's Emscripten
     * backend implements it via pointer-lock, which needs a user gesture. */
    cursor: none;
  }
  #status {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 6px 10px; background: rgba(0,0,0,.75);
    font-variant-numeric: tabular-nums;
  }
  #status.done { display: none; }

  /* Crash overlay. Hidden until something actually goes wrong; then it owns
     the screen, because a frozen canvas with the answer buried in devtools is
     how a crash gets misreported as "it just stopped". */
  #crash {
    position: fixed; inset: 0; display: none; flex-direction: column;
    background: rgba(10, 0, 0, .94); color: #f2f2f2; z-index: 10;
  }
  #crash.show { display: flex; }
  #crash h1 {
    margin: 0; padding: 10px 14px; font-size: 15px; font-weight: 600;
    background: #7a1010; color: #fff;
  }
  #crash-bar { padding: 8px 14px; display: flex; gap: 8px; align-items: center; }
  #crash-bar button {
    font: inherit; padding: 4px 12px; cursor: pointer;
    background: #333; color: #eee; border: 1px solid #666; border-radius: 3px;
  }
  #crash-bar button:hover { background: #444; }
  #crash-bar span { color: #999; }
  #crash pre {
    flex: 1; margin: 0; padding: 0 14px 14px; overflow: auto;
    font: 12px/1.45 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
  <div id="wrap">
    <!-- width/height are the DRAWING BUFFER. They must be set before the
         runtime grabs the canvas: the game blits its 640x480 EFB to this size,
         and the default 300x150 made it render into a corner. -->
    <canvas id="canvas" width="1280" height="720" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <div id="status">loading…</div>

  <div id="crash">
    <h1>Robox crashed</h1>
    <div id="crash-bar">
      <button id="crash-copy" type="button">Copy report</button>
      <button id="crash-hide" type="button">Hide</button>
      <span id="crash-note"></span>
    </div>
    <pre id="crash-log"></pre>
  </div>

<script>
  var statusEl = document.getElementById('status');

  // -------------------------------------------------------------------------
  // Crash reporting.
  //
  // Native stderr reaches us even though the game runs on a pthread worker:
  // emscripten forwards Module.printErr to each worker, which proxies every
  // line back to this thread. So one printErr hook captures the whole port's
  // diagnostics, wherever they were emitted.
  //
  // The native reporter wraps its output in !!!ROBOX-CRASH-BEGIN/END!!!
  // markers (see sdk/robox_profiler.c and sdk/robox_web_debug.c). Everything
  // between them is the report; we also keep a rolling tail of ordinary log
  // lines, because the last few hundred lines before a crash are usually what
  // explain it.
  // -------------------------------------------------------------------------
  var LOG_TAIL = 400;
  var logTail = [], crashLines = [], inCrash = false, crashShown = false;

  var crashEl  = document.getElementById('crash');
  var crashLog = document.getElementById('crash-log');
  var crashNote = document.getElementById('crash-note');

  function crashText() {
    return crashLines.join('\n') +
           '\n\n---- last ' + logTail.length + ' log lines before the crash ----\n' +
           logTail.join('\n');
  }

  function showCrash(headline) {
    if (!crashShown && headline) { crashLines.unshift(headline); }
    crashShown = true;
    crashLog.textContent = crashText();
    crashEl.className = 'show';
    statusEl.className = 'done';
    // Survives the reload people reflexively do after a crash.
    try { localStorage.setItem('robox.lastCrash', crashText()); } catch (e) {}
  }

  // Draw-key self-check output, kept outside the rolling tail so it survives
  // the thousands of boot lines. "no stale keys" only means anything if you
  // can also see that the check was switched on, so the ON/off announcement
  // is captured here too.
  window.roboxKeyLines = [];

  function noteLine(t) {
    var s = String(t);
    if (s.indexOf('[GX-KEY]') >= 0) window.roboxKeyLines.push(s);
    if (s.indexOf('[splash]') >= 0) window.roboxKeyLines.push(s);
    if (s.indexOf('!!!ROBOX-CRASH-BEGIN!!!') >= 0) { inCrash = true; return; }
    if (s.indexOf('!!!ROBOX-CRASH-END!!!') >= 0) {
      inCrash = false;
      showCrash('');
      return;
    }
    if (inCrash) { crashLines.push(s); return; }
    logTail.push(s);
    if (logTail.length > LOG_TAIL) logTail.shift();
  }

  document.getElementById('crash-copy').addEventListener('click', function () {
    navigator.clipboard.writeText(crashText()).then(
      function () { crashNote.textContent = 'copied'; },
      function () { crashNote.textContent = 'copy failed — select the text below'; });
  });
  document.getElementById('crash-hide').addEventListener('click', function () {
    crashEl.className = '';
  });

  // A trap on the browser main thread (the proxied GL calls live there) never
  // reaches the native handler, and neither does a worker that dies outright.
  window.addEventListener('error', function (e) {
    crashLines.push('window error: ' + (e.message || e.type));
    if (e.error && e.error.stack) crashLines.push(e.error.stack);
    showCrash('Uncaught error on the page (not caught by the native handler).');
  });
  window.addEventListener('unhandledrejection', function (e) {
    crashLines.push('unhandled rejection: ' + (e.reason && e.reason.stack ?
                    e.reason.stack : e.reason));
    showCrash('Unhandled promise rejection.');
  });

  // -------------------------------------------------------------------------
  // Save persistence.
  //
  // The guest writes its save slots with plain fopen/fwrite into "nand/",
  // which on this target is MEMFS -- RAM that dies with the tab. IDBFS backs
  // that one directory with IndexedDB so saves survive a reload.
  //
  // All of this runs on the browser MAIN thread deliberately: there is exactly
  // one filesystem and the main thread owns it. The guest worker's file I/O is
  // already proxied here by emscripten (every FS syscall starts with
  // `if (ENVIRONMENT_IS_PTHREAD) return proxyToMainThread(...)`), which is why
  // the game itself needs no changes.
  //
  // IDBFS's autoPersist is deliberately NOT used. It flushes on every mutation
  // including the truncate inside NANDCreate, so a tab closed in the wrong
  // millisecond could publish a 0-byte slot over a good save. Corruption is a
  // worse bug than the volatility being fixed. The guest tells us when a save
  // is genuinely complete instead -- see hle_NANDClose in sdk/robox_io.c.
  // -------------------------------------------------------------------------
  var NAND_DIR = '/nand';
  var nandReady = false;

  // Fetch an Emscripten runtime export WITHOUT tripping its guard.
  //
  // A runtime method that is not in EXPORTED_RUNTIME_METHODS is installed as a
  // property whose GETTER calls abort(). So `Module.FS` does not return
  // undefined when FS is unexported -- it kills the page. Reading the property
  // descriptor and using only a plain `value` sidesteps that entirely.
  //
  // This is not hypothetical: a stale cached ROBOX.js paired with a fresh
  // index.html took the whole game down at boot with
  // "'FS' was not exported", from inside the save-restore code whose entire
  // design goal was that storage must never stop the game starting.
  function nandRt(name) {
    var M = window.Module || {};
    var d = Object.getOwnPropertyDescriptor(M, name);
    if (d && d.get) return null;          // guard stub -- treat as unavailable
    if (d && typeof d.value !== 'undefined') return d.value;
    return null;
  }

  function nandMount(done) {
    var fs = nandRt('FS'), idbfs = nandRt('IDBFS');
    if (!fs || !idbfs) {
      console.warn('[save] FS/IDBFS unavailable - progress will not be saved');
      return done();
    }
    // Private browsing and partitioned contexts have no IndexedDB at all.
    // Boot anyway on plain MEMFS: no saves is bad, no game is worse.
    if (typeof indexedDB === 'undefined' || !indexedDB) {
      console.warn('[save] IndexedDB unavailable - progress will not be saved');
      return done();
    }
    try {
      try { fs.mkdir(NAND_DIR); } catch (e) { /* already there */ }
      fs.mount(idbfs, {}, NAND_DIR);
    } catch (e) {
      console.warn('[save] mount failed, progress will not be saved: ' + e);
      return done();
    }
    // true = populate the in-memory FS FROM IndexedDB.
    fs.syncfs(true, function (err) {
      if (err) {
        console.warn('[save] restore failed: ' + err);
      } else {
        nandReady = true;
        console.log('[save] ready');
      }
      done();
    });
  }

  // Called from the guest once a save file is closed (sdk/robox_io.c), and on
  // the way out of the page. Never on create -- see the autoPersist note above.
  window.roboxNandFlush = function () {
    if (!nandReady) return;
    var fs = nandRt('FS');
    if (!fs) return;
    fs.syncfs(false, function (err) {
      if (err) console.error('[save] WRITE FAILED: ' + err);
    });
  };

  // A tab can be closed or backgrounded without the game ever closing its
  // file. Cheap insurance; on mobile, pagehide is often the only thing that
  // fires before the tab is frozen.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') window.roboxNandFlush();
  });
  window.addEventListener('pagehide', function () { window.roboxNandFlush(); });

  var Module = {
    // ?gxverify=1 turns on the draw-key self-check (RECOMP_GX_KEY_VERIFY): it
    // recomputes the full state hash every draw and logs "[GX-KEY] STALE KEY"
    // if the memo disagrees. Slow, but it is what proves the memo's
    // invalidation set is complete rather than merely believed to be.
    preRun: [function () {
      if (/[?&]gxverify=1/.test(location.search)) {
        ENV.RECOMP_GX_KEY_VERIFY = '1';
        console.warn('[robox] GX draw-key verification ON (slower)');
      }
      // Hold main() until the saves are back. Without the gate the game can
      // read an empty /nand before IndexedDB has been read into it, and report
      // "no save data" on a profile that exists.
      var add = nandRt('addRunDependency'), rem = nandRt('removeRunDependency');
      if (!add || !rem) {
        try { nandMount(function () {}); } catch (e) {
          console.warn('[save] setup failed, continuing without saves: ' + e);
        }
        return;
      }
      add('robox-nand');
      var released = false;
      var release = function () {
        if (released) return;
        released = true;
        rem('robox-nand');
      };
      // Storage must never be able to wedge the boot. A five-second stall is
      // loud and diagnosable; a page that never starts is not.
      setTimeout(function () {
        if (!released) console.warn('[save] storage timed out - booting without saves');
        release();
      }, 5000);
      // Nothing in here may take the game down with it. The run dependency is
      // already armed, so even a throw still releases and the game boots.
      try { nandMount(release); } catch (e) {
        console.warn('[save] setup failed, continuing without saves: ' + e);
        release();
      }
    }],
    canvas: (function () {
      var c = document.getElementById('canvas');
      // A lost WebGL context otherwise fails silently and the page just goes
      // black, which is indistinguishable from a rendering bug.
      c.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
        statusEl.className = '';
        statusEl.textContent = 'WebGL context lost — reload the page.';
      }, false);
      return c;
    })(),
    setStatus: function (text) {
      if (!text) { statusEl.className = 'done'; return; }
      statusEl.className = '';
      statusEl.textContent = text;
    },
    print:    function (t) { console.log(t); noteLine(t); },
    printErr: function (t) { console.error(t); noteLine(t); },
    // Forwarded to the workers the same way printErr is, so an abort() on the
    // guest thread surfaces here rather than vanishing.
    onAbort:  function (what) {
      crashLines.push('abort(): ' + what);
      showCrash('The runtime aborted.');
    }
  };

  // Keyboard goes to the canvas, not the page (arrows would scroll otherwise).
  window.addEventListener('load', function () {
    document.getElementById('canvas').focus();
  });
</script>
