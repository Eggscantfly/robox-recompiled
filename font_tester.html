            color: #eee;

            padding: 50px;

            width: 400px;
            margin-bottom: 20px;

            border: 1px solid #555;
            background: #333;
            color: #fff;

            background-color: #000;
            border: 2px solid #444;
            image-rendering: pixelated; /* Keeps the pixel font sharp */
            transform: scale(2); /* Make it bigger */
            transform-origin: top center;
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('textInput');
        const img = document.getElementById('fontImage');

        function drawText(text) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cursorX = 10;
            const cursorY = 40; // Center vertically somewhat
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                
                if (char === ' ') {
                    cursorX += 8; // Space width
                    continue;
                }
                
                const charData = fontData[char];
                if (charData) {
                    ctx.drawImage(
                        img,
                        charData.x, charData.y, charData.width, charData.height,
                        cursorX, cursorY + (charData.yOffset || 0), charData.width, charData.height
                    );
                    cursorX += charData.width + 1; // 1 pixel gap between chars
                } else {
                    // Fallback for missing characters (e.g., draw a box or just skip)
                    cursorX += 8;
                }
            }
        }

        img.onload = () => {
            drawText(input.value);
        };

        input.addEventListener('input', (e) => {
            drawText(e.target.value);
        });
        
        // If image is already loaded from base64 (it usually is instantly)
        if (img.complete) {
            drawText(input.value);
        }
    </script>
