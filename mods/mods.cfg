# Robox mod loader -- mods/mods.cfg
#
# One "id = 0|1" per mod. Anything after '#' is a comment.
# Override at runtime with ROBOX_MOD_<ID>=0|1 (env wins over this file).
# A mod whose required file is missing is forced off regardless.

# Host MIDI + DLS music sampler.        needs: mods/robox.dls
music = 1

# Music packs: stream WAV/OGG/RBXS files needs: mods/wav_music.cfg
# in place of the songs mapped there.
# (.rbxs = RBXS sound header with loop points + OGG/WAV inside)
wavmusic = 1

# Local / online co-op: second player.  needs: nothing
coop  = 0

# Super Mario Bros. movement: the player runs on bit-exact SMB1 physics
# (walk/run accel, skid, variable-height jumps).   needs: nothing
# Tune: ROBOX_MARIO_SCALE (units per SMB px, default 2.0),
#       ROBOX_MARIO_SMALL=1, ROBOX_MARIO_PROBE=1 for telemetry.
mario = 1

# Discord Rich Presence.                needs: nothing
# Shows "Playing ROBOX Recompiled" on your profile. Silently does nothing if
# Discord is not running; reconnects on its own if you start it later.
discord = 1
