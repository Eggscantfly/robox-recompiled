# Robox controller mapping.  BUTTON = key
#
# Edit and restart. Anything after '#' is a comment. Blank lines are ignored.
# Names are case-insensitive. A button may be listed more than once to give it
# several keys.
#
# Key names are SDL key names: single characters (a, z, 5), or
# Return, Space, Escape, Tab, Backspace, Left, Right, Up, Down,
# Left Shift, Left Ctrl, Left Alt, F1..F12, Keypad 0 .. Keypad 9, and so on.
#
# Buttons:
#   A  B  1  2  PLUS  MINUS  HOME
#   DUP  DDOWN  DLEFT  DRIGHT     (d-pad)
# Host-side actions, not Wii buttons:
#   TILTL  TILTR  SHAKE
#
# This file is the SHIPPED default. The in-game settings menu (Esc) writes the
# player's own layout to nand/controls.cfg, which REPLACES this one rather than
# merging with it -- the lookup returns the first entry matching a key, so a
# leftover default would shadow a fresh rebind.
#
# Give each key exactly one job. Two entries sharing a key means the earlier one
# always wins and the later one silently does nothing.
#
# Not remappable here: the mouse drives the Wii pointer (left/right click are
# also A/B), and WASD is the nunchuk stick.

# Bound the obvious way on purpose. Robox is played holding the Wiimote
# SIDEWAYS, so the d-pad needs a quarter turn -- but that belongs in code
# (video_input_hold), NOT here. Rotating the bindings instead makes the
# settings menu read "up = Left", which is our workaround leaking into the
# player's face.
DUP    = Up
DDOWN  = Down
DLEFT  = Left
DRIGHT = Right

# 2 is jump and 1 is action, matching the game's own "(1) back (2) confirm".
2      = X
1      = Z

PLUS   = Return

# N/M rather than Alt/Ctrl: remote-desktop and streaming clients commonly
# swallow the modifiers before the page ever sees them.
TILTL  = N
TILTR  = M
SHAKE  = C

# Kept so the pause/HOME menu stays reachable and the on-screen touch buttons
# have something to map onto.
A      = Space
B      = B
MINUS  = -
HOME   = H
